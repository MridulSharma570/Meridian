# ============================================================================
# MERIDIAN — full stack: app + PostgreSQL + Redis
# Developed by Mridul Sharma
#   docker compose up -d --build
#   open http://localhost:8000
# ============================================================================
services:
  app:
    build: .
    container_name: meridian-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://meridian:meridian@db:5432/meridian
      REDIS_URL: redis://redis:6379/0
      MERIDIAN_FERNET_KEY: ${MERIDIAN_FERNET_KEY:-}
      MERIDIAN_DATA_DIR: /app/data
      MERIDIAN_EXPORT_DIR: /app/data/exports
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
    volumes:
      - meridian_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: meridian-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: meridian-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  meridian_data:
  postgres_data:
  redis_data:
