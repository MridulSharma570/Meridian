[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "1.0.0"
description = "Meridian — AI-powered market intelligence SaaS with six autonomous agents and a translator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mridul Sharma"}]
keywords = ["market-intelligence", "multi-agent", "ai", "saas", "fastapi", "streamlit"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/MridulSharma570/Meridian"
Repository = "https://github.com/MridulSharma570/Meridian"
Documentation = "https://github.com/MridulSharma570/Meridian/tree/main/docs"

[project.scripts]
meridian = "run:main"
meridian-db = "scripts.setup_db:main"
meridian-seed = "scripts.seed_data:main"

[tool.setuptools]
packages = ["app", "app.agents", "app.api", "app.data_sources", "app.export",
            "app.database", "app.ui", "scripts"]

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "assets/custom.css",
       "assets/images/*.svg", "assets/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "F401", "E402"]
